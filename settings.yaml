script:
  - id: saver_enabled
    then:
      - if:
          condition: 
            switch.is_on: s_saver 
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - delay: !lambda return id(s_saver_delay).state * 1000;
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            #- display.page.show: saver_page
            - component.update: s3_box_lcd
      - if:
          condition:
            - switch.is_on: s_saver_mode            
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: saver_enabled_manual
    then:
      - if:
          condition: 
            - switch.is_on: s_saver 
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            #- display.page.show: saver_page
            - component.update: s3_box_lcd
      - if:
          condition:
            - switch.is_on: s_saver_mode            
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
            - component.update: s3_box_lcd
    mode: restart 

  - id: matrix_animation
    then:
        - lambda: |-
            auto it = id(s3_box_lcd);

            const char* matrix_chars = "{font_glyphs}";
            const int chars_count = strlen(matrix_chars);
            const int columns = 320 / 14;
            int drops[columns];

            for (int i = 0; i < columns; i++)
              drops[i] = rand() % 240;

            //it->clear();

            // Matrix-style falling animation
            for (int step = 0; step < 20; step++) {
              //it->clear();
              for (int i = 0; i < columns; i++) {
                // Head character (bright white)
                it->printf(i * 14, drops[i], id(my_font28), id(white), TextAlign::TOP_LEFT, "%c", matrix_chars[rand() % chars_count]);

                // Trail characters (green)
                for (int t = 1; t < 5; t++) {
                  int trail_pos = drops[i] - (t * 14);
                  if (trail_pos >= 0 && trail_pos < 240) {
                    it->printf(i * 14, trail_pos, id(my_font28), id(green), TextAlign::TOP_LEFT, "%c", matrix_chars[rand() % chars_count]);
                  }
                }

                drops[i] += 14;
                if (drops[i] > 240 + rand() % 100)
                  drops[i] = 0;
              }

              it->update();
              delay(50);
            }

            // // Draw a broken/cracked screen effect
            // for (int i = 0; i < 20; i++) {
            //     int x0 = rand() % it->get_width();
            //     int y0 = rand() % it->get_height();
            //     int x1 = rand() % it->get_width();
            //     int y1 = rand() % it->get_height();
            //     it->line(x1, y1, x0, y0, id(white));
            //     it->update();  
            // }
  