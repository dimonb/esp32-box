top_layer: !- $import('pages/top_layer.yaml')
weather: !- $import('pages/weather.yaml')
resources: !- $import('pages/resources.yaml')
main: !- $import('pages/main.yaml')
#image: !? $_.resources.image

image:
  - !for $_.resources.image.where($.id = "logo_img"): !()
    - !? $

icon_glyphs: !- $_.resources.icon_glyphs

font:
  - !for $_.resources.font.where($.id = "icon_font_35" or $.id = "my_font28" or $.id = "icon_font_75" or $.id = "icon_font_60"): !()
    - !? $.mergeWith(dict("bpp" => 1))
  - !for $_.resources.font.where($.id = "my_font82" or $.id = "my_font72"): !()
    - !? $.mergeWith(dict("bpp" => 4, "glyphs" => "0123456789:JFMAOSNDTWabcdeghiklmnpqrvwxyz"))
  - !for $_.resources.font.where($.id = "my_font18" or $.id = "my_font22"): !()
    - !? $.mergeWith(dict("bpp" => 4))
  - !for $_.resources.font.where($.id = "icon_font_15" or $.id = "icon_font_25"): !()
    - !? $.mergeWith(dict("bpp" => 8))
lvgl:
  displays:
    - s3_box_lcd
  touchscreens:
    - s3_box_touch
  top_layer: !? $import('pages/top_layer.yaml')

  pages:
    - !? $import('pages/main.yaml')
    - !? $import('pages/settings.yaml')
    - !? $import('pages/wifi_info.yaml')
    - !? $_.weather

  style_definitions: !? $import('pages/styles.yaml')


color: !? $_.resources.color


hass: !- $import('hass.yaml')

settings: !- $import('settings.yaml')
number: !? $_.settings.number
switch: 
  - !for $_.settings.switch: !()
    - !? $.delete("on_turn_off").delete("on_turn_on")

# Example configuration entry
http_request:
  useragent: esphome/device
  timeout: 10s
  verify_ssl: false


time:
  - platform: sntp
    id: ha_time
    timezone: Asia/Jerusalem
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
    on_time_sync:
      - lambda: |-
          ESP_LOGI("lvgl", "Time synced %s", id(ha_time).now().strftime("%H:%M").c_str());
      - !? $_.main.time_update.action
      - !? $_.main.date_update.action
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - lambda: |-
              ESP_LOGI("lvgl", "Time updated %s", id(ha_time).now().strftime("%H:%M").c_str());
          - !? $_.main.time_update.action
          - !? $_.main.date_update.action
    
script:   
  - !for $_.settings.script: !()
    - !? $ 
  # - !for $_.lvgl.top_layer.script: !()
  #   - !? $

esphome:
  name: test-esp32-device
  friendly_name: test-esp32-device
  platformio_options:
    build_flags:
       - -D LV_USE_CHART=1
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(time_display_format).publish_state("24 Hr");
          id(temperature_bedroom).publish_state(21.2);
          id(co2_bedroom).publish_state(600);
          id(openweathermap_condition).publish_state("cloudy");
          id(openweathermap_temperature).publish_state(18.0);
          
      - component.update: s3_box_lcd
  includes:
    - helpers.h

  

esp32:
  board: esp32s3box
  # flash_size: 16MB
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/dimonb/esphome_audio
      ref: dev-next
    components: [ adf_pipeline, i2s_audio ]
    refresh: 0s  
  - source:  github://dimonb/esphome@dev
    components: [ http_request]


wifi:
  on_connect:
    - lambda: |-
        ESP_LOGI("lvgl", "Connected to WiFi");
    - lambda: |-
        id(wifi_connection) = true;
    - !? $_.top_layer.wifi_status_update.action
    - !? $_.weather.weather_update_data.action
  on_disconnect:
    - lambda: |-
        ESP_LOGI("lvgl", "Disconnected from WiFi");
    - lambda: |-
        id(wifi_connection) = false;
    - !? $_.top_layer.wifi_status_update.action

  ssid: "Wokwi-GUEST"
  ap:
    ssid: ${name}
    password: s3box123


ota:
  - platform: esphome
api:
  encryption:
    key: !secret esphome_api_key

  on_client_connected:
    - lambda: |-
        ESP_LOGI("lvgl", "Client connected to API");
        id(api_connection) = true;
    - !? $_.top_layer.api_status_update.action
  on_client_disconnected:
    - lambda: |-
        ESP_LOGI("lvgl", "Client disconnected from API");
        id(api_connection) = false;
    - !? $_.top_layer.api_status_update.action

time:
  - platform: homeassistant
    id: ha_time


logger:
  hardware_uart: UART0 # Emulator uses UART0, real device uses USB_CDC
  level: DEBUG
  #logs:
  #  lvgl: VERBOSE


globals:
  - id: wifi_connection
    type: bool
    restore_value: no
    initial_value: "false"

  - id: api_connection
    type: bool
    restore_value: no
    initial_value: "false" 


output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 50ms

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

display:
  - platform: ili9xxx
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    #reset_pin:
    #  number: 48
    #  inverted: true
    #update_interval: 5s
    id: s3_box_lcd
    auto_clear_enabled: false
    invert_colors: false
    # Width = 320, Height = 240
    #lambda: !? $_.render


sensor:
  - platform: copy 
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""   

  - platform: wifi_signal
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - !for $_.hass.sensor: !()
    - !? '$.delete("entity_id").delete("attribute").mergeWith(dict("platform" => "template"))'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: ip_addr
      entity_category: "diagnostic"
    ssid:
      id: connected_ssid
      name: SSID
      entity_category: "diagnostic"
    bssid:
      id: connected_bssid
      name: BSSID
      entity_category: "diagnostic"
    mac_address:
      id: device_mac

  - !for $_.hass.text_sensor: !()
    - !? '$.delete("entity_id").delete("attribute").mergeWith(dict("platform" => "template"))'

  - platform: template
    id: time_display_format
    update_interval: never

  - platform: template
    id: temp_json
    internal: true
    update_interval: 600s
    lambda: |-
      return std::string("{\"00\": 9.5,\"01\":11.4,\"02\":12.1,\"03\":13.4,\"04\":13.4,\"05\":12.4,\"06\":15.4,\"07\":13.4,\"08\":13.4,\"09\":13.4,\"10\":13.4,\"11\":16.4,\"12\":13.4,\"13\":13.4,\"14\":13.4,\"15\":13.4,\"16\":13.4,\"17\":13.4,\"18\":13.4,\"19\":13.4,\"20\":11.5, \"21\": 10.5, \"22\": 9.5, \"23\": 8.5}");



  
binary_sensor:
  - platform: tt21100
    id: home_button
    index: 0
    on_press:
      - lvgl.page.show: page_main

  - !for $_.hass.binary_sensor: !()
    - !? $


## BEGIN - Touchscreen
i2c:
  sda: GPIO8
  scl: GPIO18
  scan: false

touchscreen:
  - platform: tt21100
    #update_interval: 50ms
    address: 0x24
    interrupt_pin: GPIO3
    #reset_pin: GPIO48
    display: s3_box_lcd
    id: s3_box_touch
    transform:
      #swap_xy: true
      mirror_x: true
      mirror_y: false
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240
