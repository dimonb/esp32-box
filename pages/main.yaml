resources: !- $import('resources.yaml')
icon_glyphs: !- $_.resources.icon_glyphs


time_update: !-
  text:
    format: "%s"
    args:
      - !? '"id(ha_time).now().strftime(\"%H:%M\").c_str()"'
  action:
    lvgl.label.update:
      id: label_clock
      text: !? $_.time_update.text

date_update: !-
  text:
    format: "%s"
    args:
      - !? '"id(ha_time).now().strftime(\"%a %d %b\").c_str()"'
  action:
    lvgl.label.update:
      id: label_date
      text: !? $_.date_update.text


button_light_update: !-
  text_color: !lambda |-
    return id(bedroom_light).state ? lv_color_make(id(yellow)) : lv_color_make(id(blue));
  action:
    lvgl.button.update:
      id: button_light
      text_color: !? $_.button_light_update.text_color

id: page_main
bg_color: black
widgets:
    - obj:
        align: BOTTOM_MID
        styles: [layout_box, main_layout]
        layout:
          type: GRID
          grid_columns: [FR(1)]
          grid_rows: [50, 40, 80]
        widgets:
          - label:
              id: label_clock
              text: !? $_.time_update.text
              text_font: my_font82
              text_color: white
              grid_cell_row_pos: 0
              grid_cell_column_pos: 0
              grid_cell_x_align: CENTER
              grid_cell_y_align: STRETCH
          - label:
              id: label_date
              text: !? $_.date_update.text
              text_font: my_font22
              text_color: white
              grid_cell_row_pos: 1
              grid_cell_column_pos: 0
              grid_cell_x_align: CENTER
              grid_cell_y_align: END

          - obj:
              styles: [layout_box]
              grid_cell_row_pos: 2
              grid_cell_column_pos: 0
              grid_cell_x_align: STRETCH
              grid_cell_y_align: STRETCH
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_main: CENTER
                flex_align_cross: CENTER
                flex_align_track: CENTER
                pad_column: 20
              widgets:
                - button:
                    id: button_music
                    styles: [main_page_button]
                    on_click:
                      - lambda: |-
                          ESP_LOGI("page_main", "Music button clicked");
                    widgets:
                      - label:
                          text: !? $_.icon_glyphs.music
                - button:
                    id: button_light
                    styles: [main_page_button]
                    on_click:
                      - lambda: |-
                          ESP_LOGI("page_main", "Light button clicked");
                      - homeassistant.service:
                          service: light.toggle
                          data:
                            entity_id: light.pw_switch02
                    widgets:
                      - label:
                          text: !? $_.icon_glyphs.light_on
                    text_color: !? $_.button_light_update.text_color
                - button:
                    id: button_weather
                    styles: [main_page_button]
                    on_click:
                      - lambda: |-
                          ESP_LOGI("page_main", "Weather button clicked");

                      - lambda: |-
                          current_show_day = 1;
                          draw_weather_chart(weather_chart_obj);
                      - lvgl.page.show: page_weather
                    widgets:
                      - label:
                          x: -7
                          y: 0
                          text: !? $_.icon_glyphs.weather_partly_cloudy
                          text_font: icon_font_60
                          text_color: white
                      - label:
                          x: 43
                          y: 50
                          text: 12°
                          text_font: my_font22
                          text_color: white
