resources: !- $import('resources.yaml')
icon_glyphs: !- $_.resources.icon_glyphs


script: !-
  - id: weather_update_data
    then:
      - http_request.get:
          url: "http://api.open-meteo.com/v1/forecast?latitude=32.79920904119136&longitude=34.97237608011288&past_days=1&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,precipitation_probability,diffuse_radiation&timezone=auto&forecast_days=11"
          capture_response: true
          max_response_buffer_size: 32768
          on_response: 
            then:
              - if:
                  condition:
                      lambda: return response->status_code == 200;
                  then:
                      - lambda: |-
                          ESP_LOGD("weather", "Response size: %d", body.size());
                      - lambda: |-
                          json::parse_json(body, [](JsonObject root) -> bool {
                              weather_data.set(root);
                              return true;
                          });
                  else:
                      - logger.log:
                          format: "Error: Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]
    mode: restart



id: page_weather
bg_color: black
widgets:
  - obj:
      align: BOTTOM_MID
      styles: [layout_box, main_layout]
      layout:
        type: GRID
        grid_columns: [FR(1)]
        grid_rows: [30, 160]
      on_click:
        - lambda: |-
            draw_weather_chart(weather_chart_obj);
      widgets:
        - obj:
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: [layout_box]
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            widgets:
              - label:
                  id: weather_day_label
                  text: "Thu 6 Mar 2025"
                  text_font: my_font22
                  text_color: light_blue
                  align: CENTER
              - button:
                  id: weather_day_button_left
                  align: LEFT_MID
                  x: 10
                  styles: [weather_small_icon_button]
                  on_click:
                    - lvgl.pause  # pause the chart refresh, to avoid flickering
                    - lambda: |-
                        ESP_LOGI("lvgl", "Button < clicked");
                        current_show_day--;
                        draw_weather_chart(weather_chart_obj);
                        if (current_show_day == 0) {
                          lv_obj_add_flag(weather_day_button_left, LV_OBJ_FLAG_HIDDEN);
                        } 
                        if (current_show_day < 11) {
                          lv_obj_clear_flag(weather_day_button_right, LV_OBJ_FLAG_HIDDEN);
                        }
                    - lvgl.resume
                  widgets:
                    - label:
                        text: !? $_.icon_glyphs.arrow_left
                        text_font: icon_font_25
                        text_color: light_blue
                        align: CENTER
              - button:
                  id: weather_day_button_right
                  align: RIGHT_MID
                  x: -10
                  styles: [weather_small_icon_button]
                  on_click:
                    - lvgl.pause  # pause the chart refresh, to avoid flickering
                    - lambda: |-
                        ESP_LOGI("lvgl", "Button > clicked");
                        current_show_day++;
                        draw_weather_chart(weather_chart_obj);
                        if (current_show_day > 0) {
                          lv_obj_clear_flag(weather_day_button_left, LV_OBJ_FLAG_HIDDEN);
                        }
                        if (current_show_day == 11) {
                          lv_obj_add_flag(weather_day_button_right, LV_OBJ_FLAG_HIDDEN);
                        }
                    - lvgl.resume
                  widgets:
                    - label:
                        text: !? $_.icon_glyphs.arrow_right
                        text_font: icon_font_25
                        text_color: light_blue
                        align: CENTER
        - obj:
            id: weather_chart_obj
            styles: [layout_box]
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            widgets:
              - label:
                  text: !lambda '{draw_weather_chart(weather_chart_obj); return "";}'
