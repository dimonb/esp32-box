resources: !- $import('resources.yaml')
icon_glyphs: !- $_.resources.icon_glyphs


mic_status_update: !-
  text_color: !lambda |-
      return id(mute_switch).state ? lv_color_make(id(red)) : lv_color_make(id(green));
  text: 
    format: "%s"
    args:
      - !? '"id(mute_switch).state ? \"" + $_.icon_glyphs.mic_off + "\" : \"" + $_.icon_glyphs.mic_on + "\""'

widgets:
  - obj:
      x: 4
      align: TOP_LEFT
      styles: [layout_box]
      width: SIZE_CONTENT
      height: 40
      layout:
        pad_column: 3
        type: GRID
        grid_columns: [CONTENT, CONTENT, CONTENT]
        grid_rows: [39]
      widgets:
        - label:
            id: api_status
            styles: [toolbar_icon]
            text: !? $_.icon_glyphs.api_connected
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            on_click:
              - lvgl.page.show: settings_page
        - label:
            id: wifi_status
            styles: [toolbar_icon]
            text: !? $_.icon_glyphs.wifi_connected
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            on_click:
              - lambda: |-
                  ESP_LOGI("lvgl", "WIFI connected");
              - lvgl.page.show: page_wifi_info
        - label:

            id: mic_status
            styles: [toolbar_icon]
            text_color: !? $_.mic_status_update.text_color
            text: !? $_.mic_status_update.text
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            on_click:
              - switch.toggle: mute_switch
              - lvgl.label.update:
                  id: mic_status
                  text_color: !? $_.mic_status_update.text_color
                  text: !? $_.mic_status_update.text
              - lambda: |-
                  ESP_LOGI("lvgl", "Microphone %s", id(mute_switch).state ? "off" : "on");

  - obj:
      x: 0
      align: TOP_RIGHT
      styles: [layout_box]
      width: SIZE_CONTENT
      height: 35
      layout:
        pad_column: 3
        type: GRID
        grid_columns: [CONTENT, CONTENT, CONTENT]
        grid_rows: [FR(1)]
      widgets:
        - label:
            id: temp_bedroom_status
            styles: [toolbar_text]
            text: 
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
        - label:
            id: co2_bedroom_status
            styles: [toolbar_text]
            text: 
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            grid_cell_y_align: CENTER
        - label:
            id: co2_bedroom_icon
            styles: [toolbar_icon]
            text_font: icon_font_25
            height: 25
            width: 20
            pad_right: 2
            text: !? $_.icon_glyphs.co2
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            grid_cell_y_align: END
            
