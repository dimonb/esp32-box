resources: !- $import('resources.yaml')
icon_glyphs: !- $_.resources.icon_glyphs


mic_status_update: !-
  text_color: !lambda |-
      return id(mute_switch).state ? lv_color_make(id(red)) : lv_color_make(id(green));
  text: 
    format: "%s"
    args:
      - !? '"id(mute_switch).state ? \"" + $_.icon_glyphs.mic_off + "\" : \"" + $_.icon_glyphs.mic_on + "\""'

wifi_status_update: !-
  text_color: !lambda |-
      return id(wifi_connection) ? lv_color_make(id(green)) : lv_color_make(id(red));
  text: 
    format: "%s"
    args:
      - !? '"id(wifi_connection) ? \"" + $_.icon_glyphs.wifi_connected + "\" : \"" + $_.icon_glyphs.wifi_disconnected + "\""'
  action:
    lvgl.label.update:
        id: wifi_status
        text_color: !? $_.wifi_status_update.text_color
        text: !? $_.wifi_status_update.text

api_status_update: !-
  text_color: !lambda |-
      return id(api_connection) ? lv_color_make(id(green)) : lv_color_make(id(red));
  text: 
    format: "%s"
    args:
      - !? '"id(api_connection) ? \"" + $_.icon_glyphs.api_connected + "\" : \"" + $_.icon_glyphs.api_disconnected + "\""'
  action:
    lvgl.label.update:
        id: api_status
        text_color: !? $_.api_status_update.text_color
        text: !? $_.api_status_update.text

widgets:
  - obj:
      align: TOP_MID
      styles: [layout_box]
      height: SIZE_CONTENT
      width: 310
      layout:
        pad_column: 5
        type: FLEX
        flex_align_cross: CENTER
      widgets:
        - obj:
            align: TOP_LEFT
            styles: [layout_box]
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            flex_grow: 1
            layout:
              pad_column: 5
              type: FLEX
            widgets:
              - label:
                  id: api_status
                  styles: [toolbar_icon]
                  text: !? $_.api_status_update.text
                  text_color: !? $_.api_status_update.text_color
                  on_click:
                    - if:
                        condition:
                          - lvgl.page.is_showing: page_settings
                        then:
                          - lvgl.page.show: page_main
                        else:
                          - lvgl.page.show: page_settings
              - label:
                  id: wifi_status
                  styles: [toolbar_icon]
                  text: !? $_.wifi_status_update.text
                  text_color: !? $_.wifi_status_update.text_color 
                  on_click:
                    - lambda: |-
                        ESP_LOGI("lvgl", "WIFI connected");
                    - lvgl.page.show: page_wifi_info
              - label:

                  id: mic_status
                  styles: [toolbar_icon]
                  text_color: !? $_.mic_status_update.text_color
                  text: !? $_.mic_status_update.text
                  on_click:
                    - switch.toggle: mute_switch
                    - lvgl.label.update:
                        id: mic_status
                        text_color: !? $_.mic_status_update.text_color
                        text: !? $_.mic_status_update.text
                    - lambda: |-
                        ESP_LOGI("lvgl", "Microphone %s", id(mute_switch).state ? "off" : "on");

        - obj:
            align: RIGHT_MID
            styles: [layout_box]
            width: 180
            height: SIZE_CONTENT
            layout:
              type: FLEX
              flex_align_cross: END
            widgets:
              - label:
                  id: temp_bedroom_status
                  styles: [toolbar_text]
                  text: ""
                  flex_grow: 1
              - obj:
                  width: 82
                  height: SIZE_CONTENT
                  styles: [layout_box]
                  widgets:
                    - label:
                        align: LEFT_MID
                        id: co2_bedroom_status
                        styles: [toolbar_text]
                        text: ""
                    - label:
                        align: BOTTOM_RIGHT
                        id: co2_bedroom_icon
                        styles: [toolbar_icon]
                        text_font: icon_font_25
                        height: 20
                        width: 20
                        text: !? $_.icon_glyphs.co2
                  
